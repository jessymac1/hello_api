[project]
name = "hello_api"
version = "0.1.0"
description = "A tiny FastAPI app with hello and goodbye endpoints."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "google-genai (>=3.0.0,<4.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
